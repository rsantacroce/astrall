[package]
name = "astrall"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Mapa astral natal: cálculo local, histórico salvo e interpretação por LLM"

[lib]
name = "astrall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
astro-core = { path = "../crates/astro-core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"

# Chaves de API ficam no cofre do sistema. No Android (ainda não é um alvo) caem no banco local.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[features]
# Inclui o motor Swiss Ephemeris. O binário resultante é AGPL-3.0 (ou exige a licença
# comercial da Astrodienst): não ligue em builds que vão ser distribuídos com código fechado.
swisseph = ["astro-core/swisseph"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
